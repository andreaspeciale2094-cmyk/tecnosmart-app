<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Bomber 17</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#000;color:#f9fafb;padding:16px;max-width:480px;margin:auto;overflow-x:hidden;-webkit-text-size-adjust:100%}
h1{font-size:26px;margin:0;letter-spacing:1px}
.head{display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px 0 18px;text-align:center}
.logo{width:200px;height:200px;margin:0;border-radius:50%;background:#000;box-shadow:0 0 28px #1da1ff55;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;font-size:30px;color:#fff;flex:none}
.logo img{width:100%;height:100%;object-fit:contain}
.logo small{display:block;font-size:10px;color:#9ca3af}
.card{border:1px solid #0d2438;background:#07131f;border-radius:16px;padding:16px;margin-bottom:16px}
label{display:block;font-size:14px;color:#9ca3af;margin:10px 0 4px}
input{width:100%;font-size:22px;padding:12px;border-radius:12px;border:0;background:#0d2438;color:#fff}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.pay button{padding:16px 4px;font-size:16px;border-radius:12px;border:2px solid #0d2438;background:#0d2438;color:#fff}
.pay button.on{border-color:#1da1ff;background:#1da1ff;color:#fff}
.add{width:100%;margin-top:16px;padding:16px;font-size:20px;font-weight:700;border:0;border-radius:14px;background:#1da1ff;color:#fff}
.tabs{display:flex;gap:6px;background:#000;border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:12px 4px;font-size:16px;font-weight:600;border:0;border-radius:11px;background:none;color:#9ca3af}
.tabs button.on{background:#1da1ff;color:#fff}
[hidden]{display:none!important}
.mese{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mese button{font-size:22px;background:#0d2438;color:#fff;border:0;border-radius:10px;padding:6px 14px}
.mese b{text-transform:capitalize}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #0d2438;font-size:18px}
.tot{font-size:22px;font-weight:700;color:#fff;border:0}
.corsa{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #0d2438}
.corsa small{color:#9ca3af;display:block}
.corsa button{background:none;border:0;color:#f87171;font-size:22px}
.vuoto{color:#9ca3af;text-align:center;padding:10px}
</style></head><body>
<div class="head"><label class="logo" id="logoBox" title="Tocca per cambiare il logo"><img id="logo" alt="Bomber 17" src="logo.png"><input type="file" id="logoFile" accept="image/*" hidden></label><h1>Bomber 17<small style="display:block;font-size:13px;font-weight:400;color:#1da1ff">Le mie corse</small></h1></div>

<div class="card">
  <label>Importo (€)</label>
  <input id="importo" type="number" inputmode="decimal" step="0.01" placeholder="0,00">
  <label>Luogo</label>
  <input id="luogo" type="text" placeholder="Es. Stazione → Aeroporto" style="font-size:18px">
  <label>Come ha pagato</label>
  <div class="pay" id="pay"></div>
  <button class="add" id="add">+ Aggiungi corsa</button>
</div>

<div class="card">
  <div class="tabs"><button id="tG" class="on">Giornaliero</button><button id="tM">Mese</button></div>
  <div id="vM" hidden>
    <div class="mese"><button id="prev">‹</button><b id="nome"></b><button id="next">›</button></div>
    <div id="totali"></div>
  </div>
  <div id="vG">
    <div class="mese"><button id="gprev">‹</button><b id="gnome"></b><button id="gnext">›</button></div>
    <div id="gtotali"></div>
    <div id="lista"></div>
  </div>
</div>

<script>
var giorno=new Date();
function isoG(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var METODI=["POS","Uber","App/Voucher","Contanti"];
var KEY="corse_taxi_v1";
var metodo=METODI[0], vista=new Date(); vista.setDate(1);
function carica(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function salva(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){alert("Impossibile salvare su questo telefono")}}
function euro(n){return n.toLocaleString("it-IT",{style:"currency",currency:"EUR"})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function chiave(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}

function disegnaPay(){
  var el=document.getElementById("pay");el.innerHTML="";
  METODI.forEach(function(m){
    var b=document.createElement("button");b.textContent=m;
    if(m===metodo)b.className="on";
    b.onclick=function(){metodo=m;disegnaPay()};el.appendChild(b);
  });
}
function disegna(){
  var k=chiave(vista), tutte=carica();
  var corse=tutte.filter(function(c){return c.data.slice(0,7)===k});
  document.getElementById("nome").textContent=vista.toLocaleDateString("it-IT",{month:"long",year:"numeric"});
  var tot={},somma=0;METODI.forEach(function(m){tot[m]=0});
  corse.forEach(function(c){tot[c.metodo]=(tot[c.metodo]||0)+c.importo;somma+=c.importo});
  var h="";METODI.forEach(function(m){h+='<div class="row"><span>'+m+'</span><span>'+euro(tot[m])+'</span></div>'});
  h+='<div class="row tot"><span>Totale ('+corse.length+(corse.length===1?' corsa':' corse')+')</span><span>'+euro(somma)+'</span></div>';
  document.getElementById("totali").innerHTML=h;
  var gi=isoG(giorno),gc=tutte.filter(function(c){return c.data===gi}),gs=0;
  gc.forEach(function(c){gs+=c.importo});
  var oggi=isoG(new Date());
  document.getElementById("gnome").textContent=(gi===oggi?"Oggi · ":"")+giorno.toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"});
  var gt={};METODI.forEach(function(m){gt[m]=0});gc.forEach(function(c){gt[c.metodo]=(gt[c.metodo]||0)+c.importo});
  var gh="";METODI.forEach(function(m){gh+='<div class="row"><span>'+m+'</span><span>'+euro(gt[m])+'</span></div>'});
  gh+='<div class="row tot"><span>Totale giorno ('+gc.length+(gc.length===1?' corsa':' corse')+')</span><span>'+euro(gs)+'</span></div>';
  document.getElementById("gtotali").innerHTML=gh;
  document.getElementById("add").textContent="+ Aggiungi corsa"+(gi===oggi?"":" · "+giorno.toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"}));
  var l="";
  gc.slice().reverse().forEach(function(c){
    var g="";
    l+='<div class="corsa"><div><b>'+euro(c.importo)+'</b> · '+esc(c.metodo)+'<small>'+(c.luogo?esc(c.luogo):"—")+'</small></div><button data-id="'+c.id+'" aria-label="Elimina">✕</button></div>';
  });
  var le=document.getElementById("lista");
  le.innerHTML=l||'<div class="vuoto">Nessuna corsa in questo giorno</div>';
  le.querySelectorAll("button").forEach(function(b){b.onclick=function(){
    if(confirm("Eliminare questa corsa?")){salva(carica().filter(function(c){return String(c.id)!==b.dataset.id}));disegna()}}});
}
document.getElementById("add").onclick=function(){
  var imp=parseFloat(document.getElementById("importo").value.replace(",","."));
  if(!(imp>0)){alert("Scrivi l'importo della corsa");return}
  var t=carica();
  t.push({id:Date.now(),data:isoG(giorno),importo:imp,luogo:document.getElementById("luogo").value.trim(),metodo:metodo});
  salva(t);
  document.getElementById("importo").value="";document.getElementById("luogo").value="";
  disegna();
};
function vaiMese(n){vista.setMonth(vista.getMonth()+n);var t=new Date();
  giorno=(vista.getFullYear()===t.getFullYear()&&vista.getMonth()===t.getMonth())?t:new Date(vista.getFullYear(),vista.getMonth(),1);disegna()}
function vaiGiorno(n){if(n>0&&isoG(giorno)>=isoG(new Date()))return;giorno=new Date(giorno.getFullYear(),giorno.getMonth(),giorno.getDate()+n);vista=new Date(giorno.getFullYear(),giorno.getMonth(),1);disegna()}
document.getElementById("prev").onclick=function(){vaiMese(-1)};
document.getElementById("next").onclick=function(){vaiMese(1)};
document.getElementById("gprev").onclick=function(){vaiGiorno(-1)};
document.getElementById("gnext").onclick=function(){vaiGiorno(1)};
function tab(v){document.getElementById("vG").hidden=v!=="G";document.getElementById("vM").hidden=v!=="M";
  document.getElementById("tG").className=v==="G"?"on":"";document.getElementById("tM").className=v==="M"?"on":""}
document.getElementById("tG").onclick=function(){tab("G")};
document.getElementById("tM").onclick=function(){tab("M")};
disegnaPay();disegna();tab("G");
</script></body></html>
