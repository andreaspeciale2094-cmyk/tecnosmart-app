<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TecnoSmart Srl</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TecnoSmart">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="icon" href="icons/favicon-32.png" sizes="32x32">

<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:#0b1220;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    overflow:hidden;
  }
  #appFrame{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    border:none;
    background:#0b1220;
  }
  #splash{
    position:fixed;
    inset:0;
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:24px;
    text-align:center;
    background:#0b1220;
    transition:opacity .35s ease;
  }
  #splash.fade-out{
    opacity:0;
    pointer-events:none;
  }
  #splash img{
    width:112px;
    height:112px;
    border-radius:24px;
    box-shadow:0 8px 30px rgba(0,0,0,0.45);
    background:#0b1220;
  }
  #splash h1{
    color:#fff;
    font-size:22px;
    font-weight:800;
    margin:0;
    letter-spacing:.3px;
  }
  #splash p{
    color:#93a2bd;
    font-size:15px;
    margin:0;
  }
  .spinner{
    width:34px;
    height:34px;
    border-radius:50%;
    border:3px solid rgba(255,152,0,0.25);
    border-top-color:#ff9800;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #fallback{
    display:none;
    margin-top:6px;
  }
  #fallback a{
    color:#ff9800;
    font-weight:700;
    text-decoration:none;
    border-bottom:2px solid rgba(255,152,0,0.4);
  }
</style>
</head>
<body>

<iframe id="appFrame"
        src="https://script.google.com/macros/s/AKfycbwAbKGE3LvDJgiTbNP_j4xHJ3gEpnHsTjOqBfgySaCwW81I6qih4DQCSVBPUk9LDiVb/exec"
        allow="clipboard-read; clipboard-write"></iframe>

<div id="splash">
  <img src="icons/icon-192.png" alt="TecnoSmart">
  <h1>TECNOSMART SRL</h1>
  <div class="spinner"></div>
  <p>Apertura dell'app in corso&hellip;</p>
  <div id="fallback">
    <p>Se non si carica, <a id="fallbackLink" target="_blank" href="#">apri qui in una nuova scheda</a>.</p>
  </div>
</div>

<script>
  var appFrame = document.getElementById('appFrame');
  var splash = document.getElementById('splash');
  var fallback = document.getElementById('fallback');

  document.getElementById('fallbackLink').href = appFrame.src;

  function hideSplash() {
    splash.classList.add('fade-out');
    setTimeout(function(){ splash.style.display = 'none'; }, 400);
  }

  appFrame.addEventListener('load', hideSplash);

  setTimeout(function(){
    fallback.style.display = 'block';
  }, 4000);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>

</body>
</html>
