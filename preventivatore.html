<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preventivatore Allarmi</title>
<script>if(/[?&]app=1/.test(location.search))document.documentElement.classList.add('emb');</script>
<style>
/* Layout: form a sinistra, riepilogo fisso a destra; su telefono tutto in colonna con barra totale in basso */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#14202b; --muted:#5b6b7a; --line:#d9e0e7;
  --accent:#0b6e8a; --accent-fg:#ffffff; --accent-soft:#e1f1f6; --danger:#b42318; --imgbg:#ffffff;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0e141a; --surface:#161e27; --fg:#e6edf3; --muted:#92a2b2; --line:#27323e;
    --accent:#4cc3e0; --accent-fg:#06222b; --accent-soft:#12303a; --danger:#ff8a80; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#0e141a; --surface:#161e27; --fg:#e6edf3; --muted:#92a2b2; --line:#27323e;
    --accent:#4cc3e0; --accent-fg:#06222b; --accent-soft:#12303a; --danger:#ff8a80; color-scheme:dark;}
/* Dentro l'app TecnoSmart (?app=1): stessi colori dell'app, senza intestazione */
:root.emb{--bg:#0b1220; --surface:#121a29; --fg:#f2f5fb; --muted:#93a2bd; --line:#1f2a42;
  --accent:#ff8a3d; --accent-fg:#1a0f00; --accent-soft:rgba(255,138,61,.14); --danger:#ff7a7a; color-scheme:dark}
.emb header,.emb .note{display:none}
.emb body{padding-block:10px 84px}
.emb .btn.pri{background:linear-gradient(135deg,#ff8a3d,#ff6b1a);border-color:transparent;color:#1a0f00}
.emb .tabs button[aria-selected="true"]{background:linear-gradient(135deg,#ff8a3d,#ff6b1a)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--font-body);padding-inline:16px;padding-block:20px 96px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:1.9rem;line-height:1.1;letter-spacing:-.01em}
h2{font-size:1rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.eyebrow{margin:0 0 2px;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.kit input:focus-visible+.card{outline:3px solid var(--accent);outline-offset:2px}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin:0 0 16px;font-size:.92rem}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}
.steps{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=tel],input[type=email],input[type=number],select,textarea{
  font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical}
select:disabled{opacity:.5}
.kits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kit{position:relative;display:block;cursor:pointer}
.kit input{position:absolute;opacity:0;inset:0}
.kit .card{display:flex;flex-direction:column;gap:4px;height:100%;border:2px solid var(--line);border-radius:10px;padding:14px;background:var(--bg)}
.kit input:checked+.card{border-color:var(--accent);background:var(--accent-soft)}
.kit .nm{font-weight:700;font-size:1.15rem}
.kit .pr{font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums}
.kit .mo{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.kit .iv{font-size:.78rem;color:var(--muted)}
.inc{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.inc h3{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.inc ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.inc li{display:flex;align-items:center;gap:8px;font-size:.92rem;min-width:0}
.inc .q{font-weight:700;min-width:1.6em;font-variant-numeric:tabular-nums}
.thumb{width:56px;height:56px;border-radius:8px;background:var(--imgbg);border:1px solid var(--line);object-fit:contain;flex:none}
.thumb.s{width:34px;height:34px;border-radius:6px}
.thumb.ph{display:inline-block}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item .tx{min-width:0;flex:1}
.item .nm{font-weight:600}
.item .pr{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:1.2rem;cursor:pointer}
.step output{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cond{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;min-height:42px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.warn{font-size:.85rem;color:var(--muted);margin:10px 0 0}
.sum{position:sticky;top:16px}
.sum .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-variant-numeric:tabular-nums}
.sum .row span:first-child{min-width:0}
.sum .muted{color:var(--muted);font-size:.9rem}
.sum hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.big{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:700}
.big .lb{font-size:.9rem;text-transform:uppercase;letter-spacing:.05em}
.big .vl{font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.big.mo .vl{color:var(--accent)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn{font:inherit;font-weight:600;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:11px 12px;cursor:pointer}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--danger)}
.toast{min-height:1.3em;font-size:.88rem;color:var(--muted);margin:8px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .t{font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.bar .t small{display:block;font-weight:600;color:var(--muted)}
.lrow{display:grid;grid-template-columns:minmax(0,3fr) 120px 120px 44px;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.lrow.k{grid-template-columns:minmax(0,2fr) 120px 120px}
.lrow:first-of-type{border-top:0}
.lrow label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted);min-width:0}
.lrow .del{height:42px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--danger);font-size:1.1rem;cursor:pointer}
.lrow .nmimg{display:flex;gap:10px;align-items:flex-end}
.lrow .nmimg label{flex:1}
.lh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.coef{display:grid;grid-template-columns:90px repeat(3,minmax(0,1fr));gap:8px;align-items:center}
.coef b{font-size:.85rem}
#foglio{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .sum{position:static}
  .bar{display:flex}
}
@media (max-width:620px){
  .fields,.cond,.kits,.inc ul{grid-template-columns:minmax(0,1fr)}
  .lrow,.lrow.k{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .lrow>label:first-child,.lrow>.nmimg,.lrow.k>label:first-child{grid-column:1/-1}
  h1{font-size:1.6rem}
}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;color:#000;padding:0;font-size:10.5pt}
  .wrap,.bar{display:none!important}
  #foglio{display:block;color:#000;font-family:var(--font-body)}
  #foglio h1{font-size:21pt}
  #foglio .top{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:12px}
  #foglio .az{font-size:10pt;line-height:1.4;text-align:right}
  #foglio table{width:100%;border-collapse:collapse;margin:8px 0}
  #foglio th{text-align:left;font-size:8.5pt;text-transform:uppercase;letter-spacing:.05em;border-bottom:1.5px solid #000;padding:5px 4px}
  #foglio td{padding:6px 4px;border-bottom:1px solid #bbb;vertical-align:middle;break-inside:avoid}
  #foglio .r{text-align:right;white-space:nowrap}
  #foglio .pimg{width:46px}
  #foglio .pimg img{width:42px;height:42px;object-fit:contain;display:block}
  #foglio .strip{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  #foglio .strip img{width:30px;height:30px;object-fit:contain;border:1px solid #ccc;border-radius:4px}
  #foglio .tot{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:12px;margin-top:12px;break-inside:avoid}
  #foglio .tot div{border:1.5px solid #000;padding:7px 12px;min-width:170px}
  #foglio .tot b{display:block;font-size:16pt}
  #foglio .sm{font-size:8.5pt;color:#333}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Servizio allarme</p>
      <h1>Preventivatore Allarmi</h1>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sezioni">
      <button id="tab-prev" role="tab" aria-selected="true">Preventivo</button>
      <button id="tab-list" role="tab" aria-selected="false">Listino</button>
    </nav>
  </header>

  <div id="view-prev">
    <p class="note">Listino copiato dal simulatore WindTre Online (pagina del 16/02/2026). Controlla ogni tanto che i prezzi siano ancora quelli.</p>
    <div class="layout">
      <div class="steps">
        <section class="panel">
          <h2>Cliente</h2>
          <div class="fields">
            <label class="f" for="c-nome">Nome e cognome<input id="c-nome" type="text" autocomplete="off"></label>
            <label class="f" for="c-tel">Telefono<input id="c-tel" type="tel" inputmode="tel" autocomplete="off"></label>
            <label class="f" for="c-email">Email del cliente<input id="c-email" type="email" inputmode="email" autocomplete="off"></label>
            <label class="f" for="c-tipo">Tipo di immobile
              <select id="c-tipo"><option>Appartamento</option><option>Villa</option><option>Negozio</option><option>Ufficio</option><option>Magazzino</option></select>
            </label>
            <label class="f full" for="c-ind">Indirizzo dell'impianto<input id="c-ind" type="text" autocomplete="off"></label>
          </div>
        </section>
        <section class="panel">
          <h2>Kit</h2>
          <div class="kits" id="kits" role="radiogroup" aria-label="Kit"></div>
          <div class="inc" id="inc"></div>
        </section>
        <section class="panel">
          <h2>Dispositivi aggiuntivi</h2>
          <div id="items"></div>
        </section>
        <section class="panel">
          <h2>Sconti e pagamento</h2>
          <div class="cond">
            <label class="f" for="o-sconto">Sconto sul kit
              <select id="o-sconto"></select>
            </label>
            <label class="chk" for="o-conv"><input id="o-conv" type="checkbox"><span id="conv-lb">Sconto Convergenza / Special</span></label>
            <label class="f" for="o-fin">Finanziamento
              <select id="o-fin"><option value="0">Nessun finanziamento</option><option value="36">36 mesi</option><option value="48">48 mesi</option><option value="60">60 mesi</option></select>
            </label>
            <label class="f" for="o-fz">Finanziaria
              <select id="o-fz"><option value="compass">Compass</option><option value="deutsche">Deutsche Bank</option></select>
            </label>
          </div>
          <p class="warn" id="cond-warn"></p>
        </section>
      </div>

      <aside class="panel sum" id="riepilogo" aria-live="polite">
        <h2>Riepilogo</h2>
        <div id="sum"></div>
        <div class="actions">
          <button class="btn pri" id="b-print" type="button">Stampa / PDF</button>
          <a class="btn pri" id="b-mail" target="_blank" rel="noopener noreferrer" href="https://mail.google.com/mail/?view=cm&amp;fs=1">Invia con Gmail</a>
          <button class="btn" id="b-copy" type="button">Copia testo</button>
          <button class="btn danger" id="b-new" type="button">Nuovo preventivo</button>
        </div>
        <p class="toast" id="toast" role="status"></p>
      </aside>
    </div>
  </div>

  <div id="view-list" hidden></div>
</div>

<div class="bar" id="bar">
  <div class="t" id="bar-t"></div>
  <button class="btn pri" id="b-go" type="button">Riepilogo</button>
</div>

<div id="foglio"></div>

  try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.kits&&o.items&&o.azienda&&o.sconti&&o.coef)return o;}}catch(e){}

}

var state={kit:'casa',qty:{},sconto:'none',conv:false,fin:0,fz:'compass'};
function client(){return{nome:$('c-nome').value.trim(),tel:$('c-tel').value.trim(),email:$('c-email').value.trim(),tipo:$('c-tipo').value,ind:$('c-ind').value.trim()};}
function kitOf(){return cat.kits.filter(function(k){return k.id===state.kit;})[0]||cat.kits[0];}
function kitPrice(k){return k.iva?k.price*(1+cat.iva):k.price;}
function kitMonthly(k){return k.iva?k.monthly*(1+cat.iva):k.monthly;}

function calc(){
  var k=kitOf(),solo=!!k.solo;
  var extras=[];
  cat.items.forEach(function(i){var q=state.qty[i.id]||0;if(q>0)extras.push({i:i,q:q});});
  var kp=kitPrice(k),km=kitMonthly(k);
  var extP=0,extM=0;extras.forEach(function(x){extP+=x.i.price*x.q;extM+=x.i.monthly*x.q;});
  var dK=0,dM=0,labels=[];
  if(!solo){
    if(state.sconto==='k250'){dK=cat.sconti.k250;labels.push('Sconto kit −'+eur(dK));}
    if(state.sconto==='k125'){dK=cat.sconti.k125;labels.push('Sconto kit −'+eur(dK));}
    if(state.sconto==='k100'){dK=cat.sconti.k100;dM+=cat.sconti.k100m;labels.push('Sconto kit −'+eur(dK)+' e −'+eur(cat.sconti.k100m)+'/mese');}
    if(state.conv){dM+=cat.sconti.conv;labels.push('Sconto Convergenza / Special −'+eur(cat.sconti.conv)+'/mese');}
  }
  var once=Math.max(0,kp+extP-dK);
  var monthly=Math.max(0,km+extM-dM);
  var fin=solo?0:state.fin,rata=0,tab=0,mesi=0,totale=0;
  if(fin>0){
    mesi=fin;totale=once+monthly*mesi;
    tab=Math.ceil(Math.round(totale*100)/100/50)*50;
    var c=(cat.coef[state.fz]||{})[fin]||0;
    rata=Math.round(tab*c/1000*10)/10;
  }
  return{kit:k,solo:solo,extras:extras,kp:kp,km:km,extP:extP,extM:extM,dK:dK,dM:dM,labels:labels,once:once,monthly:monthly,fin:fin,mesi:mesi,totale:totale,tab:tab,rata:rata};
}

function renderKits(){

    return '<label class="kit"><input type="radio" name="kit" value="'+esc(k.id)+'"'+(k.id===state.kit?' checked':'')+'><span class="card"><span class="nm">'+esc(k.name)+'</span><span class="pr">'+eur(p)+'</span><span class="mo">+ '+eur(m)+' al mese</span>'+(k.iva?'<span class="iv">IVA inclusa ('+eur(k.price)+' + IVA)</span>':'')+'</span></label>';
  }).join('');
}
function renderInc(){

  $('inc').innerHTML='<h3>Compreso nel '+esc(k.name)+'</h3><ul>'+k.inc.map(function(r){

  }).join('')+'</ul>';
}

function renderCond(){
  var k=kitOf(),s=cat.sconti,solo=!!k.solo;
  var cur=state.sconto;
  $('o-sconto').innerHTML='<option value="none">Nessuno</option><option value="k250">Sconto kit −'+eur(s.k250)+'</option><option value="k125">Sconto kit −'+eur(s.k125)+'</option><option value="k100">Sconto kit −'+eur(s.k100)+' e −'+eur(s.k100m)+'/mese</option>';
  $('o-sconto').value=cur;
  $('conv-lb').textContent='Sconto Convergenza / Special (−'+eur(s.conv)+'/mese)';
  $('o-sconto').disabled=solo;$('o-conv').disabled=solo;$('o-fin').disabled=solo;
  $('o-fz').disabled=solo||state.fin===0;
  $('o-conv').checked=!solo&&state.conv;
  $('o-fin').value=String(solo?0:state.fin);$('o-fz').value=state.fz;
  var w='';
  if(solo)w='Con Solo Servizio non sono previsti sconti né finanziamento.';
  else if(state.fin>0&&state.fz==='compass')w='La prima rata include l\'imposta sostitutiva dello 0,25% sull\'importo finanziato. Rata indicativa, può variare.';
  else if(state.fin>0)w='Per chi non è già cliente Deutsche Bank è prevista una rata di incasso di 3 € al mese. Rata indicativa, può variare.';
  $('cond-warn').textContent=w;
}

function lineList(c){
  var l=[];
  l.push({d:c.kit.name,sub:'',q:1,v:c.kp,kit:true});
  c.extras.forEach(function(x){l.push({d:x.i.name,sub:eur(x.i.price)+' + '+eur(x.i.monthly)+'/mese cad.',q:x.q,v:x.i.price*x.q,key:x.i.id});});
  if(c.dK>0)l.push({d:'Sconto sul kit',sub:'',q:1,v:-c.dK});
  return l;
}
function renderSummary(){
  var c=calc();
  var h='';
  h+='<div class="row"><span>'+esc(c.kit.name)+'</span><span>'+eur(c.kp)+'</span></div>';
  c.extras.forEach(function(x){h+='<div class="row"><span>'+x.q+' × '+esc(x.i.name)+'</span><span>'+eur(x.i.price*x.q)+'</span></div>';});
  if(c.dK>0)h+='<div class="row"><span>Sconto sul kit</span><span>− '+eur(c.dK)+'</span></div>';
  h+='<hr><div class="big"><span class="lb">Costo del kit</span><span class="vl">'+eur(c.once)+'</span></div>';
  if(c.kit.iva)h+='<div class="row muted"><span>IVA inclusa</span><span></span></div>';
  h+='<hr><div class="big mo"><span class="lb">Canone al mese</span><span class="vl">'+eur(c.monthly)+'</span></div>';
  if(c.dM>0)h+='<div class="row muted"><span>sconto canone −'+eur(c.dM)+'/mese compreso</span><span></span></div>';
  if(c.fin>0){
    h+='<hr><div class="big mo"><span class="lb">Rata mensile</span><span class="vl">'+eur(c.rata)+'</span></div>';
    h+='<div class="row muted"><span>'+c.mesi+' mesi, '+(state.fz==='compass'?'Compass':'Deutsche Bank')+'</span><span></span></div>';
    h+='<div class="row muted"><span>comprende kit e servizio</span><span>tot. '+eur(c.totale)+'</span></div>';
  }
  $('sum').innerHTML=h;
  $('bar-t').innerHTML='<small>Kit / canone'+(c.fin>0?' / rata':'')+'</small>'+eur(c.once)+' · '+eur(c.monthly)+(c.fin>0?' · '+eur(c.rata):'');
  renderFoglio(c);
}

function dateIt(){return new Date().toLocaleDateString('it-IT');}
function renderFoglio(c){
  var cl=client(),a=cat.azienda,solo=c.solo;
  $('b-mail').href='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(cl.email)+'&su='+encodeURIComponent('Preventivo allarme'+(cl.nome?' - '+cl.nome:''))+'&body='+encodeURIComponent(textQuote());
  var rows='';
  lineList(c).forEach(function(x){
    var im=x.key&&IMG[x.key]?'<img src="'+IMG[x.key]+'" alt="">':'';
    var det=x.sub?'<div class="sm">'+esc(x.sub)+'</div>':'';
    if(x.kit&&c.kit.inc.length){
      det+='<div class="sm">'+c.kit.inc.map(function(r){return r[0]+' '+esc(r[1]);}).join(' · ')+'</div><div class="strip">'+c.kit.inc.filter(function(r){return r[2]&&IMG[r[2]];}).map(function(r){return '<img src="'+IMG[r[2]]+'" alt="">';}).join('')+'</div>';
    }
    rows+='<tr><td class="pimg">'+im+'</td><td><b>'+esc(x.d)+'</b>'+det+'</td><td class="r">'+x.q+'</td><td class="r">'+(x.v<0?'− ':'')+eur(Math.abs(x.v))+'</td></tr>';
  });
  var tot='<div>Costo del kit<b>'+eur(c.once)+'</b><span class="sm">'+(c.kit.iva?'IVA inclusa':'IVA inclusa nei prezzi')+'</span></div>'+
    '<div>Canone al mese<b>'+eur(c.monthly)+'</b>'+(c.labels.length?'<span class="sm">sconti applicati</span>':'')+'</div>';
  if(c.fin>0)tot+='<div>Rata mensile<b>'+eur(c.rata)+'</b><span class="sm">'+c.mesi+' mesi, '+(state.fz==='compass'?'Compass':'Deutsche Bank')+'</span></div>';
  var notes=[];
  if(c.labels.length)notes.push('Sconti: '+c.labels.join('; ')+'.');
  if(c.fin>0)notes.push('La rata comprende kit e servizio per '+c.mesi+' mesi (totale '+eur(c.totale)+'), è indicativa e può variare in base alla finanziaria.'+(state.fz==='compass'?' La prima rata include l\'imposta sostitutiva dello 0,25%.':' Rata di incasso di 3 € al mese se non già cliente Deutsche Bank.'));
  $('foglio').innerHTML=
    '<div class="top"><div><h1>Preventivo allarme</h1><div class="sm">Data: '+dateIt()+'</div></div>'+
    '<div class="az"><b>'+esc(a.nome)+'</b>'+(a.tel?'<br>'+esc(a.tel):'')+(a.email?'<br>'+esc(a.email):'')+'</div></div>'+
    '<p><b>Cliente:</b> '+esc(cl.nome||'—')+(cl.tel?' · '+esc(cl.tel):'')+(cl.email?' · '+esc(cl.email):'')+'<br><b>Impianto:</b> '+esc(cl.tipo)+(cl.ind?', '+esc(cl.ind):'')+'</p>'+
    '<table><thead><tr><th></th><th>Descrizione</th><th class="r">Q.tà</th><th class="r">Importo</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="tot">'+tot+'</div>'+
    notes.map(function(n){return '<p class="sm">'+n+'</p>';}).join('')+
    '<p class="sm">'+esc(a.note)+'</p>';
}

function textQuote(){
  var c=calc(),cl=client(),a=cat.azienda,t=[];
  t.push('PREVENTIVO ALLARME - '+dateIt());
  if(a.nome)t.push(a.nome);
  t.push('');
  t.push('Cliente: '+(cl.nome||'-')+(cl.tel?' - '+cl.tel:''));
  t.push('Impianto: '+cl.tipo+(cl.ind?', '+cl.ind:''));
  t.push('');
  t.push(c.kit.name+': '+eur(c.kp));
  if(c.kit.inc.length)t.push('('+c.kit.inc.map(function(r){return r[0]+' '+r[1];}).join(', ')+')');
  c.extras.forEach(function(x){t.push('- '+x.q+' x '+x.i.name+': '+eur(x.i.price*x.q));});
  if(c.dK>0)t.push('Sconto sul kit: -'+eur(c.dK));
  t.push('');
  t.push('COSTO DEL KIT: '+eur(c.once)+' (IVA inclusa)');
  t.push('CANONE AL MESE: '+eur(c.monthly)+(c.dM>0?' (sconto canone compreso)':''));
  if(c.fin>0)t.push('RATA MENSILE: '+eur(c.rata)+' per '+c.mesi+' mesi (kit e servizio), indicativa');
  t.push('');
  if(a.note)t.push(a.note);
  if(a.tel||a.email)t.push([a.tel,a.email].filter(Boolean).join(' - '));
  return t.join('\n');
}

var toastT;
function toast(m){$('toast').textContent=m;clearTimeout(toastT);toastT=setTimeout(function(){$('toast').textContent='';},4000);}

function renderListino(){
  var a=cat.azienda,s=cat.sconti;
  var h='<div class="steps">';
  h+='<section class="panel"><h2>Dati azienda</h2><div class="fields">'+
    '<label class="f" for="a-nome">Nome azienda<input id="a-nome" type="text" data-az="nome" value="'+esc(a.nome)+'"></label>'+
    '<label class="f" for="a-tel">Telefono<input id="a-tel" type="tel" data-az="tel" value="'+esc(a.tel)+'"></label>'+
    '<label class="f full" for="a-email">Email<input id="a-email" type="email" data-az="email" value="'+esc(a.email)+'"></label>'+
    '<label class="f full" for="a-note">Note in fondo al preventivo<textarea id="a-note" rows="3" data-az="note">'+esc(a.note)+'</textarea></label>'+
    '</div></section>';
  h+='<section class="panel"><h2>Kit</h2>';
  cat.kits.forEach(function(k){
    h+='<div class="lrow k">'+
      '<label>Nome<input type="text" data-k="kits" data-id="'+esc(k.id)+'" data-f="name" value="'+esc(k.name)+'"></label>'+
      '<label>Prezzo (€'+(k.iva?' + IVA':'')+')<input type="number" min="0" step="0.01" data-k="kits" data-id="'+esc(k.id)+'" data-f="price" value="'+k.price+'"></label>'+
      '<label>Canone (€/mese)<input type="number" min="0" step="0.01" data-k="kits" data-id="'+esc(k.id)+'" data-f="monthly" value="'+k.monthly+'"></label></div>';
  });
  h+='<p class="warn">Il Kit Business è scritto senza IVA: il preventivo aggiunge l\'IVA al '+Math.round(cat.iva*100)+'%.</p></section>';
  h+='<section class="panel"><div class="lh"><h2 style="margin:0">Dispositivi aggiuntivi</h2><button class="btn" id="l-add" type="button">Aggiungi</button></div>';
  cat.items.forEach(function(i){
    h+='<div class="lrow">'+
      '<div class="nmimg">'+img(i.id)+'<label>Nome<input type="text" data-k="items" data-id="'+esc(i.id)+'" data-f="name" value="'+esc(i.name)+'"></label></div>'+
      '<label>Prezzo (€)<input type="number" min="0" step="0.01" data-k="items" data-id="'+esc(i.id)+'" data-f="price" value="'+i.price+'"></label>'+
      '<label>Canone (€/mese)<input type="number" min="0" step="0.01" data-k="items" data-id="'+esc(i.id)+'" data-f="monthly" value="'+i.monthly+'"></label>'+
      '<button class="del" type="button" data-del="'+esc(i.id)+'" aria-label="Elimina '+esc(i.name)+'">✕</button></div>';
  });
  h+='</section>';
  h+='<section class="panel"><h2>Sconti</h2><div class="fields">'+
    '<label class="f" for="s1">Sconto kit grande (€)<input id="s1" type="number" min="0" step="1" data-s="k250" value="'+s.k250+'"></label>'+
    '<label class="f" for="s2">Sconto kit medio (€)<input id="s2" type="number" min="0" step="1" data-s="k125" value="'+s.k125+'"></label>'+
    '<label class="f" for="s3">Sconto kit + canone: sul kit (€)<input id="s3" type="number" min="0" step="1" data-s="k100" value="'+s.k100+'"></label>'+
    '<label class="f" for="s4">Sconto kit + canone: sul canone (€/mese)<input id="s4" type="number" min="0" step="1" data-s="k100m" value="'+s.k100m+'"></label>'+
    '<label class="f" for="s5">Sconto Convergenza / Special (€/mese)<input id="s5" type="number" min="0" step="1" data-s="conv" value="'+s.conv+'"></label>'+
    '</div></section>';
  h+='<section class="panel"><h2>Rata del finanziamento</h2><p class="warn" style="margin-top:0">Rata mensile ogni 1.000 € di importo finanziato. Ricavata dal simulatore, quindi indicativa.</p>'+
    ['compass','deutsche'].map(function(f){return '<div class="coef" style="margin-top:8px"><b>'+(f==='compass'?'Compass':'Deutsche Bank')+'</b>'+[36,48,60].map(function(m){return '<label class="f" for="cf'+f+m+'">'+m+' mesi<input id="cf'+f+m+'" type="number" min="0" step="0.0001" data-cf="'+f+'" data-m="'+m+'" value="'+cat.coef[f][m]+'"></label>';}).join('')+'</div>';}).join('')+
    '</section>';
  h+='<section class="panel"><h2>Ripristino</h2><p class="warn" style="margin-top:0">Riporta tutto ai prezzi copiati dal simulatore. Le tue modifiche andranno perse.</p>'+
    '<button class="btn danger" id="l-reset" type="button">Ripristina il listino</button> <button class="btn" id="l-reset2" type="button" hidden>Sì, ripristina</button></section>';
  h+='<p class="toast">Le modifiche si salvano da sole su questo dispositivo.</p></div>';
  $('view-list').innerHTML=h;
}

function showTab(which){
  var p=which==='prev';
  $('view-prev').hidden=!p;$('view-list').hidden=p;
  $('tab-prev').setAttribute('aria-selected',p);$('tab-list').setAttribute('aria-selected',!p);
  $('bar').style.display=p?'':'none';
  if(p){renderKits();renderInc();renderItems();renderCond();renderSummary();}
  else renderListino();
  window.scrollTo(0,0);
}

$('tab-prev').addEventListener('click',function(){showTab('prev');});
$('tab-list').addEventListener('click',function(){showTab('list');});
$('kits').addEventListener('change',function(e){
  if(e.target.name==='kit'){state.kit=e.target.value;if(kitOf().solo){state.sconto='none';state.conv=false;state.fin=0;}renderInc();renderCond();renderSummary();}
});
$('items').addEventListener('click',function(e){
  var b=e.target.closest('button[data-act]');if(!b)return;
  var id=b.getAttribute('data-id'),q=state.qty[id]||0;
  q=b.getAttribute('data-act')==='plus'?q+1:Math.max(0,q-1);
  state.qty[id]=q;renderItems();renderSummary();
});
$('o-sconto').addEventListener('change',function(){state.sconto=this.value;renderSummary();});
$('o-conv').addEventListener('change',function(){state.conv=this.checked;renderSummary();});
$('o-fin').addEventListener('change',function(){state.fin=parseInt(this.value,10)||0;renderCond();renderSummary();});
$('o-fz').addEventListener('change',function(){state.fz=this.value;renderCond();renderSummary();});
['c-nome','c-tel','c-email','c-tipo','c-ind'].forEach(function(id){
  $(id).addEventListener('input',function(){renderFoglio(calc());});
  $(id).addEventListener('change',function(){renderFoglio(calc());});
});

function printCss(){var css='';try{Array.prototype.forEach.call(document.styleSheets,function(ss){Array.prototype.forEach.call(ss.cssRules,function(r){if(r.type===4&&/print/.test(r.media.mediaText)){Array.prototype.forEach.call(r.cssRules,function(x){css+=x.cssText+'\n';});}});});}catch(e){}return css;}
function doPrint(){
  renderFoglio(calc());
  if(!EMB){window.print();return;}
  var html='<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><title>Preventivo allarme</title><style>:root{--font-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}'+printCss()+'</style></head><body><div id="foglio">'+$('foglio').innerHTML+'</div></body></html>';
  var w=null;try{w=window.open('','_blank');}catch(e){w=null;}
  if(w&&w.document){w.document.open();w.document.write(html);w.document.close();setTimeout(function(){try{w.focus();w.print();}catch(e){}},400);return;}
  try{window.print();}catch(e){toast('Non riesco a stampare da qui: usa Copia testo o Invia con Gmail.');}
}
if($('b-print'))$('b-print').addEventListener('click',doPrint);
$('b-copy').addEventListener('click',function(){
  var t=textQuote();
  function fallback(){
    var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);toast(ok?'Testo copiato.':'Non riesco a copiare: usa Stampa o Email.');
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('Testo copiato, puoi incollarlo su WhatsApp.');},fallback);}
  else fallback();
});
var newArmed=false,newT;
$('b-new').addEventListener('click',function(){
  if(!newArmed){newArmed=true;this.textContent='Tocca ancora per cancellare';clearTimeout(newT);var b=this;newT=setTimeout(function(){newArmed=false;b.textContent='Nuovo preventivo';},3500);return;}
  newArmed=false;this.textContent='Nuovo preventivo';
  ['c-nome','c-tel','c-email','c-ind'].forEach(function(id){$(id).value='';});
  $('c-tipo').selectedIndex=0;
  state={kit:'casa',qty:{},sconto:'none',conv:false,fin:0,fz:'compass'};
  renderKits();renderInc();renderItems();renderCond();renderSummary();toast('Preventivo azzerato.');
});
$('b-go').addEventListener('click',function(){$('riepilogo').scrollIntoView({behavior:'smooth'});});

var lv=$('view-list');
lv.addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute('data-az')){cat.azienda[t.getAttribute('data-az')]=t.value;}
  else if(t.hasAttribute('data-s')){cat.sconti[t.getAttribute('data-s')]=Math.max(0,num(t.value));}
  else if(t.hasAttribute('data-cf')){cat.coef[t.getAttribute('data-cf')][t.getAttribute('data-m')]=Math.max(0,num(t.value));}
  else if(t.hasAttribute('data-k')){
    var list=cat[t.getAttribute('data-k')],id=t.getAttribute('data-id'),f=t.getAttribute('data-f');
    var o=list.filter(function(x){return x.id===id;})[0];if(!o)return;
    o[f]=(f==='price'||f==='monthly')?Math.max(0,num(t.value)):t.value;
  } else return;
  save();
});
lv.addEventListener('click',function(e){
  var t=e.target;
  if(t.id==='l-add'){cat.items.push({id:'i'+Date.now(),name:'Nuovo dispositivo',price:0,monthly:0});save();renderListino();return;}
  if(t.hasAttribute('data-del')){var id=t.getAttribute('data-del');cat.items=cat.items.filter(function(x){return x.id!==id;});delete state.qty[id];save();renderListino();return;}
  if(t.id==='l-reset'){$('l-reset2').hidden=false;t.hidden=true;return;}
  if(t.id==='l-reset2'){cat=clone(DEFAULT);state.qty={};save();renderListino();}
});

showTab('prev');
})();
</script>
